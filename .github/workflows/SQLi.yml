name: SQLi Fuzzing with ffuf

on:
  workflow_dispatch:

jobs:
  fuzzing:
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      # ВАЖНО: Этот шаг скачивает ваш код (и файл payloads.txt) на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ffuf
        run: |
          sudo apt-get update
          sudo apt-get install -y ffuf

      - name: Wait for Juice Shop to be ready
        run: |
          until curl -s http://localhost:3000 > /dev/null; do
            echo "Waiting for Juice Shop..."
            sleep 5
          done

      - name: Run ffuf using local payloads.txt
        run: |
          # Теперь указываем путь к локальному файлу -w payloads.txt
          # -fc 401 скрывает ошибки (Unauthorized)
          # -mc 200 показывает успешные входы (уязвимости)
          ffuf -w payloads.txt \
               -u http://localhost:3000/rest/user/login \
               -X POST \
               -d '{"email": "FUZZ", "password": "password123"}' \
               -H "Content-Type: application/json" \
               -fc 401 -mc 200,500 -v

name: SQLi Fuzzing with ffuf

on:
  workflow_dispatch:

jobs:
  fuzzing:
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      # ВАЖНО: Этот шаг скачивает ваш код (и файл payloads.txt) на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ffuf
        run: |
          sudo apt-get update
          sudo apt-get install -y ffuf

      - name: Juice Shop up
        run: |
          until curl -s http://localhost:3000 > /dev/null; do
            echo "Waiting for Juice Shop..."
            sleep 5
          done

      - name: Run ffuf
        run: |
          ffuf -w payloads.txt \
               -u http://localhost:3000/rest/user/login \
               -X POST \
               -d '{"email": "FUZZ", "password": "password123"}' \
               -H "Content-Type: application/json" \
               -o results.json -of json

      - name: Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-report
          path: results.json

